    - generic [ref=e165]:
      - heading "架构一览" [level=2] [ref=e166]
      - paragraph [ref=e167]: 桌面壳 + 内置引擎，进程边界清晰，卸载干净。
      - generic [ref=e168]: ┌─ Electron 窗口 ───────── 加载 http://127.0.0.1:<port>（DSH Web UI） │ · dsh-worktable：侧边栏抽屉 + 可停靠分屏 + 控制室看板 │ · @dsh-market/plugin：插件市场（可继续在线装插件） ├─ Electron 主进程 ─────── 生命周期 / 托盘 / 首启引导 / 日志 │ └─ 子进程：runtime\bin\dsh-web.cmd（构建期生成的启动器） └─ 内置引擎 ────────────── 便携 Node 22 LTS + @deepseek-ai/dsh + pnpm └─ 数据目录 %APPDATA%\DSH Desktop\（首启自解压 vendor.zip）
      - generic [ref=e169]: 安全设计：引擎只监听本机环回地址（127.0.0.1）并带访问令牌；外部链接一律跳系统浏览器打开；子进程调用全部使用白名单路径校验。
