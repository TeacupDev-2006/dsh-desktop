          - text: 获取），选择或保持默认工作区目录，点击「启动」。
        - listitem [ref=e92]: 开始使用：Web UI 出现后即可对话、写项目、跑任务。关闭窗口只是最小化到托盘，引擎保持运行；彻底退出请用托盘菜单。
      - paragraph [ref=e93]:
        - text: 精简版安装插件：在命令行执行
        - code [ref=e94]: "\"%APPDATA%\\DSH Desktop\\runtime\\bin\\dsh.cmd\" plugin --profile web add @dsh-market/plugin"
