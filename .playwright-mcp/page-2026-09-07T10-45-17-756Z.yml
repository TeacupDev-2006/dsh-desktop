      - paragraph [ref=e85]: 全程无需命令行（精简版装插件除外）。
      - list [ref=e87]:
        - listitem [ref=e88]:
          - text: 安装：双击安装包，自动装入用户目录（
          - code [ref=e89]: "%LOCALAPPDATA%\\Programs"
          - text: ），桌面与开始菜单创建「DSH Desktop」快捷方式。
        - listitem [ref=e90]:
          - text: 首次配置：启动后粘贴 DeepSeek API Key（在
          - link "platform.deepseek.com" [ref=e91] [cursor=pointer]:
